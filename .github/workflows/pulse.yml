name: KNRUHS notice bot

on:
  schedule:
    - cron: "*/15 * * * *"   # about every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: {}        # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pillow pypdf certifi
      - name: Check KNRUHS and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: python cloud.py
      - name: Save memory (so old notices are never posted twice)
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "update notices" && git pull --rebase -q && git push -q)
