name: KNRUHS notice bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # about every 15 minutes, off the busy :00/:15 marks (GitHub may run it late)
  workflow_dispatch:           # lets you press "Run workflow" by hand
    inputs:
      post_code:
        description: "Publish this notice code to the channel now (optional)"
        type: string
        default: ""
      repost:
        description: "Post it again even if it was already posted (for testing)"
        type: boolean
        default: false
      send_test:
        description: "Send a test message to my private Telegram chat"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Always start from the newest saved memory. (A run that waited in the queue would otherwise start
      # from the copy at the moment it was triggered, and could post a notice a second time.)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pillow pypdf certifi pymupdf google-auth requests
      - name: Check KNRUHS and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          SEND_TEST: ${{ inputs.send_test }}
          POST_CODE: ${{ inputs.post_code }}
          REPOST: ${{ inputs.repost }}
        run: python cloud.py
      # Save KNRUHS's memory straight away: posting is done, and if a later (slow) university step makes the run
      # time out or get cancelled, the next run must still know these notices were posted - otherwise it posts them again.
      - name: Save KNRUHS memory (right after posting)
        if: always()
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet || (git commit -m "update notices (KNRUHS posted)" && git pull --rebase -q && git push -q) || true
      # Other universities only go to the app (no Telegram / Facebook / Instagram yet).
      # A problem here never stops KNRUHS: this step may fail without failing the run.
      - name: Check Dr. NTR UHS (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.ntruhs.json
      - name: Check RGUHS (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.rguhs.json
      - name: Check TN Dr. MGR Medical University (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.tnmgrmu.json
      - name: Check ABVMU Uttar Pradesh (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.abvmu.json
      - name: Check RUHS Rajasthan (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.ruhs.json
      - name: Check WBUHS West Bengal (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.wbuhs.json
      - name: Check BFUHS Punjab (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.bfuhs.json
      - name: Check UHSR Haryana (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.uhsr.json
      - name: Check Chhattisgarh health university (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.cgau.json
      - name: Check BUHS Bihar (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.buhs.json
      - name: Check AMRU Himachal (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.amru.json
      - name: Check all-India notices - MCC, NMC (app only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python cloud.py --config config.national.json
      - name: Save memory (so old notices are never posted twice)
        if: always()
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add -A data data-ntruhs data-national data-rguhs data-tnmgrmu data-abvmu data-ruhs data-wbuhs data-bfuhs data-uhsr data-cgau data-buhs data-amru site
          git diff --cached --quiet || (git commit -m "update notices" && git pull --rebase -q && git push -q)
