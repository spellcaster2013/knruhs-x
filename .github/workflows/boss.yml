name: Boss bot (watchdog)

# Watches the notice bots and messages the owner on Telegram when something is wrong:
# failed/cancelled/slow runs, double posts, an expiring Facebook/Instagram token, a university website that is
# down / moved / under maintenance / blocking us, or a university that has gone quiet. Plus a daily report at 9 PM.
on:
  schedule:
    - cron: "17,47 * * * *"    # every 30 minutes, between the notice bot's runs
  workflow_dispatch:
    inputs:
      test:
        description: "Send me a test message now"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: boss
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install certifi pillow pypdf pymupdf google-auth requests
      - name: Check everything
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOSS_TEST: ${{ inputs.test }}
        run: python boss.py
      - name: Remember what was already reported
        if: always()
        run: |
          git config user.name "boss-bot"
          git config user.email "boss-bot@users.noreply.github.com"
          git add boss_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "boss: remember alerts"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "could not save boss memory (will just re-check next time)"
