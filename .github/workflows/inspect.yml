name: One-off inspect (read-only)
on:
  workflow_dispatch:
    inputs:
      notice:
        description: notice id
        default: ""
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - run: python tools/inspect_actions.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          NOTICE_ID: ${{ inputs.notice }}
