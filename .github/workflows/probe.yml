name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/probe.py https://bfuhs.ggsmch.org/robots.txt https://bfuhs.ggsmch.org/public-notice/ https://bfuhs.ggsmch.org/exam-date-sheet/ https://bfuhs.ggsmch.org/university-regular-exam/ https://bfuhs.ggsmch.org/admissions/ https://bfuhs.ggsmch.org/college-notice/ https://bfuhsonline.ggsmch.org/admissions/ > probe.log 2>&1; cat probe.log
